<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102A43">
<title>FixSure | Maintenance, managed with confidence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
:root{--navy:#102A43;--teal:#16A6A1;--bg:#F5F7FA;--ink:#172B4D;--muted:#718096;--line:#E6ECF2;--white:#fff;--green:#178B63;--amber:#D99A24;--red:#D64545;--shadow:0 12px 35px rgba(16,42,67,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:252px 1fr}.sidebar{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:4px 10px 30px;color:white;text-decoration:none}.mark{width:38px;height:38px;border-radius:12px;background:var(--teal);display:grid;place-items:center;font:800 21px Manrope}.brand strong{font:800 19px Manrope;display:block}.brand small{font-size:9px;letter-spacing:1.4px;color:#b9c9d8}.navlabel{font-size:10px;letter-spacing:1.5px;color:#8da5b8;padding:13px 12px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6d3df;text-align:left;padding:11px 12px;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#24445f;color:white}.nav button span{width:19px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;border-top:1px solid #31506a;padding:18px 10px 0;color:#c4d1dc;font-size:11px;line-height:1.6}.main{min-width:0}.top{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.4px}.top h1{font:700 20px Manrope;margin:3px 0 0}.topright{display:flex;align-items:center;gap:12px}.statuspill{font-size:11px;color:#875d12;background:#fff6df;border:1px solid #f1dfb5;border-radius:30px;padding:7px 11px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e6f5f4;color:#087d79;font-weight:700}.content{padding:30px 34px;max-width:1450px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.welcome h2{font:800 25px Manrope;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:12px;background:var(--teal);color:white}.btn.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.btn.dark{background:var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{padding:14px 16px;background:#fff9e9;border:1px solid #f0dfb5;border-radius:12px;color:#795b20;font-size:12px;line-height:1.55;margin-bottom:22px}.notice strong{display:block;margin-bottom:3px;color:#61460f}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel,.empty,.formpanel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 14px rgba(16,42,67,.025)}.stat{padding:17px}.stat .label{font-size:11px;color:var(--muted)}.stat .value{font:800 23px Manrope;margin:12px 0 5px;color:#aab5c1}.stat .sub{font-size:10px;color:#99a5b2}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:27px 0 12px}.sectionhead h3{font:700 15px Manrope;margin:0}.panel{padding:20px}.empty{padding:44px 20px;text-align:center;box-shadow:none}.emptyicon{width:48px;height:48px;border-radius:15px;background:#eaf7f6;color:#138c87;display:grid;place-items:center;margin:0 auto 14px;font-size:22px}.empty h3{font:700 16px Manrope;margin:0 0 7px}.empty p{font-size:12px;color:var(--muted);max-width:440px;margin:0 auto 17px;line-height:1.6}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:15px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink)}.quick b{display:block;font-size:12px;margin:7px 0 3px}.quick small{color:var(--muted);font-size:10px}.quick .qi{font-size:18px;color:var(--teal)}.muted{color:var(--muted)}.pagehead{margin-bottom:20px}.pagehead h2{font:800 23px Manrope;margin:0 0 6px}.pagehead p{font-size:12px;color:var(--muted);margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:11px;font-weight:700;color:#41566c}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4eb;border-radius:9px;padding:11px 12px;background:white;color:var(--ink);font-size:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #16a6a11c}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.span2{grid-column:1/-1}.formpanel{padding:22px;max-width:800px}.formpanel h3{font:700 15px Manrope;margin:0 0 5px}.formpanel>p{font-size:11px;color:var(--muted);margin:0 0 20px}.rolecards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.rolecard{padding:17px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left;color:var(--ink)}.rolecard.selected{border:2px solid var(--teal);background:#f2fbfa}.rolecard strong{display:block;font-size:13px;margin:7px 0 4px}.rolecard small{color:var(--muted);font-size:10px;line-height:1.5}.tag{display:inline-block;background:#eef3f7;color:#52677c;padding:5px 8px;border-radius:20px;font-size:10px}.footer{padding:20px 34px;color:#9aa7b4;font-size:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.mobilemenu{display:none}.apihelp{background:#f1f7fb;border:1px solid #dbe8f1;border-radius:12px;padding:14px;font-size:11px;line-height:1.6;color:#466075}.apihelp code{background:#e3edf4;padding:2px 5px;border-radius:4px}.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:12px 16px;border-radius:10px;font-size:12px;display:none;z-index:20;box-shadow:var(--shadow)}.modalback{position:fixed;inset:0;background:#102a4370;display:none;place-items:center;padding:18px;z-index:15}.modal{background:white;border-radius:16px;padding:23px;max-width:550px;width:100%;max-height:90vh;overflow:auto}.modal h3{font:700 17px Manrope;margin:0 0 7px}.modal p{font-size:12px;color:var(--muted);line-height:1.5}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(max-width:950px){.shell{grid-template-columns:220px 1fr}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:24px}.top{padding:0 24px}}
@media(max-width:700px){.shell{display:block}.sidebar{position:fixed;left:-270px;top:0;width:250px;z-index:10;transition:left .2s}.sidebar.open{left:0}.mobilemenu{display:inline-grid;place-items:center;border:0;background:white;font-size:20px;margin-right:12px}.top{height:68px;padding:0 16px}.topright .statuspill{display:none}.content{padding:20px 15px}.welcome{display:block}.welcome .btn{margin-top:15px}.grid{gap:9px}.stat{padding:13px}.stat .value{font-size:20px}.twocol{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.footer{padding:17px 15px;gap:8px;flex-wrap:wrap}.rolecards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <a class="brand" href="#" onclick="return false"><span class="mark">F</span><span><strong>FixSure<span style="color:#16A6A1">.</span></strong><small>PROPERTY OPERATIONS</small></span></a>
 <div class="navlabel">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="dashboard"><span>▦</span>Dashboard</button>
  <button data-page="properties"><span>⌂</span>Properties</button>
  <button data-page="requests"><span>▤</span>Maintenance requests</button>
  <button data-page="quotations"><span>▧</span>Quotations</button>
  <button data-page="jobs"><span>◷</span>Jobs & tracking</button>
  <button data-page="payments"><span>₦</span>Payments</button>
  <button data-page="disputes"><span>⚑</span>Disputes</button>
 </nav>
 <div class="navlabel">SERVICE PROVIDERS</div>
 <nav class="nav"><button data-page="provider"><span>◇</span>Technician profile</button><button data-page="admin"><span>⚙</span>Administration</button><button data-page="settings"><span>☷</span>API connection</button></nav>
 <div class="sidefoot">FixSure connects property managers with qualified maintenance professionals through a clear, accountable workflow.</div>
</aside>
<main class="main">
<header class="top"><div style="display:flex;align-items:center"><button class="mobilemenu" id="mobilemenu">☰</button><div><div class="eyebrow">FIXSURE WORKSPACE</div><h1 id="title">Dashboard</h1></div></div><div class="topright"><span class="statuspill">● Backend not connected</span><span class="avatar" id="userAvatar">?</span></div></header>
<div class="content" id="content"></div>
<footer class="footer"><span>© 2026 FixSure</span><span>Maintenance. Managed with confidence.</span></footer>
</main></div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
/* FixSure frontend integration layer.
   No mock business records are seeded. Connect API_BASE and endpoint paths
   when the backend contract is supplied by the backend team. */
const API_CONFIG={baseUrl:"",connected:false,endpoints:{register:"/auth/register",login:"/auth/login",me:"/auth/me",properties:"/properties",requests:"/maintenance-requests",quotations:"/quotations",jobs:"/jobs",payments:"/payments",disputes:"/disputes",technicianProfile:"/technicians/profile",providers:"/technicians",adminUsers:"/admin/users",verificationQueue:"/admin/verifications"}};
const API={
 async request(path,{method="GET",body,token}={}){if(!API_CONFIG.baseUrl)throw new Error("Backend connection is not configured yet.");const res=await fetch(API_CONFIG.baseUrl.replace(/\/$/,"")+path,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||"The server could not complete this request.");return data;},
 get(path,token){return this.request(path,{token})},post(path,body,token){return this.request(path,{method:"POST",body,token})},patch(path,body,token){return this.request(path,{method:"PATCH",body,token})}
};
const state={page:"dashboard",role:"manager",selectedRole:"manager"};
const $=s=>document.querySelector(s);
const titles={dashboard:"Dashboard",properties:"Properties",requests:"Maintenance requests",quotations:"Quotations",jobs:"Jobs & tracking",payments:"Payments",disputes:"Disputes",provider:"Technician profile",admin:"Administration",settings:"API connection"};
function toast(msg){const el=$("#toast");el.textContent=msg;el.style.display="block";clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.style.display="none",3400)}
function apiNotice(){return `<div class="notice"><strong>Backend connection pending</strong>This screen is ready for real account and business data, but the backend API is still being developed. No sample properties, people, prices or transactions are being shown. Submissions are not sent or saved until the API is connected.</div>`}
function empty(title,desc,action,label){return `<div class="empty"><div class="emptyicon">＋</div><h3>${title}</h3><p>${desc}</p>${action?`<button class="btn" onclick="${action}">${label}</button>`:""}</div>`}
function pageHead(title,desc,action,label){return `<div class="pagehead"><h2>${title}</h2><p>${desc}</p></div>${action?`<div style="margin:0 0 16px"><button class="btn" onclick="${action}">＋ ${label}</button></div>`:""}`}
function render(){
 $("#title").textContent=titles[state.page];$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 const c=$("#content");const notice=apiNotice();
 if(state.page==="dashboard"){c.innerHTML=`<div class="welcome"><div><h2>Welcome to FixSure</h2><p>Your maintenance operations workspace starts with your real information.</p></div><button class="btn" onclick="go('properties')">＋ Add a property</button></div>${notice}<div class="grid">${["Properties","Open requests","Active jobs","Pending quotations"].map(x=>`<div class="stat"><div class="label">${x}</div><div class="value">—</div><div class="sub">Available after backend connection</div></div>`).join("")}</div><div class="sectionhead"><h3>Get started</h3><span class="tag">No demo records</span></div><div class="twocol"><div class="panel"><h3 style="font:700 14px Manrope;margin:0 0 14px">Set up your workspace</h3><div class="quick"><button onclick="go('properties')"><span class="qi">⌂</span><b>Register a property</b><small>Enter a real building and address</small></button><button onclick="go('requests')"><span class="qi">▤</span><b>Create a request</b><small>Describe a maintenance issue</small></button><button onclick="go('provider')"><span class="qi">◇</span><b>Technician profile</b><small>Add services and coverage</small></button><button onclick="go('settings')"><span class="qi">⚙</span><b>Connect backend</b><small>Prepare API integration</small></button></div></div><div class="panel"><h3 style="font:700 14px Manrope;margin:0 0 10px">How FixSure works</h3><p class="muted" style="font-size:12px;line-height:1.8">Property → Maintenance request → Technician matching → Quotations → Approval → Payment → Work evidence → Completion or dispute.</p><div class="apihelp">The figures and activity panels will populate from the authenticated user's account after the API is connected.</div></div></div>`}
 if(state.page==="properties"){c.innerHTML=pageHead("Your properties","Register and manage the actual buildings you are responsible for.","openForm('property')","Register property")+notice+empty("No properties registered yet","When you add a property, it will appear here after the backend saves it. No properties have been invented or preloaded.", "openForm('property')","Add your first property")}
 if(state.page==="requests"){c.innerHTML=pageHead("Maintenance requests","Create a request for a property you manage.","openForm('request')","Create request")+notice+empty("No maintenance requests yet","Requests created by your account will appear here with their real status and technician quotations.","openForm('request')","Create a maintenance request")}
 if(state.page==="quotations"){c.innerHTML=pageHead("Quotations","Review technicians' proposed prices, scope and availability.")+notice+empty("No quotations to review","Quotations will appear when technicians submit offers for your maintenance requests. Prices are never pre-filled.")}
 if(state.page==="jobs"){c.innerHTML=pageHead("Jobs & tracking","Follow approved maintenance work, schedules and completion evidence.")+notice+empty("No jobs yet","An approved quotation will create a job record through the backend. Job progress and evidence will be displayed here.")}
 if(state.page==="payments"){c.innerHTML=pageHead("Payments","View payment references and verified transaction statuses.")+notice+`<div class="apihelp"><b>Payment integrity:</b> Payment status must come from backend verification with the configured payment provider. This frontend will never mark a payment as successful based only on a browser action.</div>`+empty("No payment records","Real payment records will appear after a job has an approved payment flow. No sample prices or transactions are displayed.")}
 if(state.page==="disputes"){c.innerHTML=pageHead("Disputes","Review and manage disagreements about maintenance work.")+notice+empty("No disputes","Disputes raised by property managers and their supporting evidence will appear here after backend integration.")}
 if(state.page==="provider"){c.innerHTML=pageHead("Technician profile","Technicians can register their real services, location, coverage and professional details.")+notice+`<div class="formpanel"><h3>Technician registration</h3><p>Enter details for the person or service provider who will carry out maintenance work.</p><form onsubmit="submitForm(event,'technician')"><div class="formgrid">${field("Full name","fullName","text","Your legal or professional name")}${field("Phone number","phone","tel","+234…")}${field("Email address","email","email","name@example.com")}${selectField("Primary service category","category",["Electrical maintenance","Plumbing","Air-conditioning and refrigeration"])}${field("Base location","location","text","City, state or area")}${field("Coverage areas","coverage","text","Areas you can serve")}${field("Years of experience","experience","number","e.g. 4")}${selectField("Availability","availability",["Available","Limited availability","Currently unavailable"])}<div class="field span2"><label>Experience and professional summary</label><textarea name="summary" placeholder="Describe your relevant experience and work"></textarea></div></div><button class="btn" type="submit">Submit technician profile</button></form></div>`}
 if(state.page==="admin"){c.innerHTML=pageHead("Administration","Administrative tools for authorised FixSure operators.")+notice+empty("Admin data unavailable","User management, technician verification, disputes and audit records require authenticated administrator access through the backend.")}
 if(state.page==="settings"){c.innerHTML=pageHead("Backend API connection","Connect this frontend to the API being developed by your teammate.")+`<div class="formpanel"><h3>Connection settings</h3><p>These settings prepare the frontend integration. The current version does not send data anywhere.</p><form onsubmit="saveApi(event)"><div class="field"><label>Backend API base URL</label><input name="baseUrl" type="url" placeholder="https://api.your-domain.com" value="${API_CONFIG.baseUrl}"></div><button class="btn" type="submit">Save connection details</button></form><div class="apihelp" style="margin-top:18px"><b>Integration contract needed from backend team</b><br>Base URL, authentication method and token response, request/response JSON shapes, endpoint paths, upload method, role permissions, error format and payment verification flow.<br><br><b>Prepared resource paths</b><br>${Object.entries(API_CONFIG.endpoints).map(([k,v])=>`<code>${k}: ${v}</code>`).join("<br>")}</div><p style="margin-top:14px;color:#9a6a16">Saving a URL alone does not mean the backend is connected. Connection testing and API contract mapping are still required.</p></div>`}
}
function field(label,name,type="text",placeholder=""){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${type==="number"?'min="0"':''}></div>`}
function selectField(label,name,opts){return `<div class="field"><label>${label}</label><select name="${name}"><option value="">Select ${label.toLowerCase()}</option>${opts.map(x=>`<option>${x}</option>`).join("")}</select></div>`}
function go(p){state.page=p;render();$("#sidebar").classList.remove("open");window.scrollTo(0,0)}
function openForm(kind){
 const cfg=kind==="property"?{title:"Register a property",desc:"Add a real property to your FixSure workspace.",fields:`${field("Property name","name","text","e.g. Riverside Apartments")}${selectField("Property type","type",["Residential building","Commercial building","Mixed-use property","Office facility","Other"])}${field("Street address","address","text","Full property address")}${field("City","city","text","City")}${field("State","state","text","State")}${field("Number of units (optional)","units","number","Number of apartments or units")}<div class="field span2"><label>Property description / access notes</label><textarea name="description" placeholder="Useful information for maintenance visits"></textarea></div>`}: {title:"Create a maintenance request",desc:"Describe a real maintenance issue at one of your registered properties.",fields:`${field("Property ID","propertyId","text","Property ID from your account")}${selectField("Service category","category",["Electrical maintenance","Plumbing","Air-conditioning and refrigeration"])}${selectField("Urgency","urgency",["Routine","Soon","Urgent"])}${field("Preferred date","preferredDate","date")}${field("Preferred time","preferredTime","time")}<div class="field span2"><label>Describe the issue</label><textarea name="description" required placeholder="What needs attention? Include relevant details."></textarea></div><div class="field span2"><label>Additional location / access information</label><textarea name="accessNotes" placeholder="Where in the property is the issue? Any access instructions?"></textarea></div>`};
 $("#modal").innerHTML=`<h3>${cfg.title}</h3><p>${cfg.desc}</p><form onsubmit="submitForm(event,'${kind}')"><div class="formgrid">${cfg.fields}</div><div class="apihelp">Backend not connected: this form is ready for API submission, but submitting is currently disabled to avoid pretending that your information has been saved.</div><div class="modalactions"><button class="btn secondary" type="button" onclick="closeModal()">Cancel</button><button class="btn" type="submit" disabled>Submit when backend is connected</button></div></form>`;
 $("#modalback").style.display="grid";
}
function closeModal(){$("#modalback").style.display="none"}
function submitForm(e,kind){e.preventDefault();toast("Backend not connected yet. Your information has not been submitted.");}
function saveApi(e){e.preventDefault();API_CONFIG.baseUrl=new FormData(e.target).get("baseUrl").trim();toast("API URL noted for this preview only. Backend connection has not been verified.");}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
document.querySelectorAll(".sidebar [data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#mobilemenu").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
$("#modalback").addEventListener("click",e=>{if(e.target.id==="modalback")closeModal()});
render();
</script>
</body></html>
